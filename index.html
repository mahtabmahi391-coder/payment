<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00B4D8">
    <meta name="description" content="Mahtab Hussain Mahi's payment and account information.">
    <title>Mahtab Hussain Mahi</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="profile-logo">MHM</div>
            <h1 id="display-name">Mahtab Hussain Mahi</h1>
            <p class="subtitle">PAYMENT ACCOUNTS</p>
            <p class="description">Choose your preferred payment method.</p>
        </header>

        <hr>

        <main id="accounts-container"></main>

        <button id="share-btn" class="share-btn">Share My Info</button>

        <footer>
            <p>© 2026 Mahtab Hussain Mahi</p>
            <button id="admin-btn" class="admin-lock" type="button">Admin Mode</button>
        </footer>
    </div>

    <div id="edit-modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-title">
            <button class="close-modal" id="close-modal" type="button" aria-label="Close">&times;</button>
            <h2 id="edit-title">Edit Information</h2>
            <div id="edit-fields"></div>
            <button class="btn btn-cyan save-btn" id="save-btn" type="button">Save to Device</button>
            <p class="modal-note">
                Changes are saved only in this browser/device. To change the default information for everyone,
                edit <strong>script.js</strong> and publish the updated files to GitHub.
            </p>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
